[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kefplayer"
version = "0.2.0"
description = "FLAC-Player mit optionaler DSP-Vorverarbeitung, Ausgabe per UPnP/DLNA an KEF LS50 Wireless (Gen1)"
readme = "README.md"
authors = [{name = "Klaus"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soundfile"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kefplayer = "kefplayer.cli:main"

[tool.setuptools]
packages = ["kefplayer"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
